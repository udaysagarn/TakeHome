# menD verification contract (copy to .github/workflows/mend-verify.yml in the target repository).
#
# menD never runs your test suite inside its own container: one image cannot hold every toolchain, and
# executing arbitrary repository code would be a far worse problem than an unverified pull request.
# Instead it asks the repository to run the commands that were agreed before any code was written, in
# the repository's own CI environment. The harness therefore lives in your repo, where you can read and
# change it, and the resulting check run is what menD believes — not the session that wrote the code.
#
# menD dispatches this workflow with the pull request's head ref, so the check run lands on the head
# commit. The job name must keep its "menD" prefix: that is how the orchestrator tells its own contract
# run apart from the repository's native checks, which always outrank it.
#
# Merge this once. Nothing here needs a secret, and it only runs when menD asks it to.
name: mend-verify

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number under verification
        required: true
      commands:
        description: Newline-separated verification commands from the agreed contract
        required: true

permissions:
  contents: read

jobs:
  menD-contract:
    name: menD / contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is being verified
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          COMMANDS: ${{ inputs.commands }}
        run: |
          {
            echo "### menD verification contract"
            echo
            echo "Pull request: #${PULL_REQUEST}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo '```'
            printf '%s\n' "$COMMANDS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Toolchains are set up by the repository, for the repository. Add or remove steps here to match
      # what your verification commands actually need — this file is yours.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json', '**/package.json') != ''
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        with:
          python-version-file: pyproject.toml

      - name: Run the agreed commands
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r command; do
            [ -z "$command" ] && continue
            echo "::group::$command"
            set +e
            bash -lc "$command"
            status=$?
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "- ✔ \`$command\` → exit 0" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ✘ \`$command\` → exit $status" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done <<< "$COMMANDS"
          exit "$failed"
