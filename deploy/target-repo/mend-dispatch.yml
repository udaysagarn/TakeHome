# Event relay for the target repository (copy to .github/workflows/mend-dispatch.yml in udaysagarn/superset).
#
# Only needed when menD is not directly reachable by GitHub. It forwards the issue event to menD's ingest
# endpoint with the same HMAC-SHA256 signature scheme GitHub itself uses, so the receiving code path is
# identical. Requires two repository secrets: MEND_INGEST_URL and MEND_INGEST_SECRET.
#
# With no public ingress at all, skip this file: menD's poller picks the label up within 30 seconds.
name: mend-dispatch

on:
  issues:
    types: [labeled]

jobs:
  relay:
    if: github.event.label.name == 'menD:fix'
    runs-on: ubuntu-latest
    steps:
      - name: Forward the event to menD
        env:
          MEND_INGEST_URL: ${{ secrets.MEND_INGEST_URL }}
          MEND_INGEST_SECRET: ${{ secrets.MEND_INGEST_SECRET }}
          PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" > payload.json
          signature="sha256=$(openssl dgst -sha256 -hmac "$MEND_INGEST_SECRET" payload.json | awk '{print $2}')"
          curl --fail --silent --show-error \
            -X POST "$MEND_INGEST_URL/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: issues" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary @payload.json
