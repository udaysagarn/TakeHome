<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720"
     font-family="'Segoe Print','Bradley Hand','Comic Sans MS',ui-rounded,sans-serif" role="img"
     aria-label="menD architecture: GitHub events enter menD, the criteria gate decides candidacy, Devin sessions scope and remediate, verification gates success, and outcomes feed a learning store">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2f2f2f; stroke-width: 2; filter: url(#rough); }
      .devin { fill: #eaf1ff; stroke: #2f5fd0; }
      .store { fill: #f3f0ff; stroke: #5b3fd0; }
      .github { fill: #f4f4f4; stroke: #3a3a3a; }
      .good { fill: #e9f9f0; stroke: #10794a; }
      .bad  { fill: #fdeeee; stroke: #b3322f; }
      .t  { font-size: 16px; fill: #1c1c1c; }
      .h  { font-size: 17px; font-weight: 700; fill: #101010; }
      .s  { font-size: 13px; fill: #4a4a4a; }
      .lbl{ font-size: 13px; fill: #3a3a3a; paint-order: stroke; stroke: #fbfaf7; stroke-width: 6px;
            stroke-linejoin: round; }
      .flow { fill: none; stroke: #4a4a4a; stroke-width: 2; marker-end: url(#arrow); filter: url(#rough); }
      .dash { stroke-dasharray: 7 6; }
      .zone { fill: none; stroke: #b9b9b9; stroke-width: 1.5; stroke-dasharray: 3 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#fbfaf7"/>

  <text x="34" y="44" class="h" font-size="24">menD — how an issue becomes a verified pull request</text>
  <text x="34" y="68" class="s" font-size="14">Devin is the executor. menD decides what is worth executing, what “done” means, and whether to believe the result.</text>

  <!-- zones -->
  <rect x="24" y="96" width="250" height="560" rx="14" class="zone"/>
  <text x="40" y="120" class="lbl">GitHub (your org)</text>
  <rect x="298" y="96" width="600" height="560" rx="14" class="zone"/>
  <text x="314" y="120" class="lbl">menD control plane (one container)</text>
  <rect x="922" y="96" width="294" height="560" rx="14" class="zone"/>
  <text x="938" y="120" class="lbl">Devin API (api.devin.ai)</text>

  <!-- github column -->
  <rect x="48" y="140" width="202" height="82" rx="12" class="box github"/>
  <text x="66" y="170" class="h">Issue labelled</text>
  <text x="66" y="194" class="t">menD:fix</text>
  <text x="66" y="212" class="s">webhook, or 30s poll</text>

  <rect x="48" y="248" width="202" height="72" rx="12" class="box github"/>
  <text x="66" y="278" class="h">Push to default branch</text>
  <text x="66" y="300" class="s">ages the repo profile</text>

  <rect x="48" y="348" width="202" height="86" rx="12" class="box github"/>
  <text x="66" y="378" class="h">Pull request</text>
  <text x="66" y="400" class="s">opened by Devin,</text>
  <text x="66" y="418" class="s">reviewed by a human</text>

  <rect x="48" y="462" width="202" height="86" rx="12" class="box github"/>
  <text x="66" y="492" class="h">Required checks</text>
  <text x="66" y="514" class="s">repo CI, or the menD</text>
  <text x="66" y="532" class="s">verification contract</text>

  <rect x="48" y="576" width="202" height="62" rx="12" class="box github"/>
  <text x="66" y="606" class="h">Labels + comments</text>
  <text x="66" y="626" class="s">human-visible projection</text>

  <!-- control plane -->
  <rect x="324" y="140" width="228" height="80" rx="12" class="box"/>
  <text x="342" y="170" class="h">Ingest</text>
  <text x="342" y="192" class="s">HMAC webhook · poller</text>
  <text x="342" y="210" class="s">one durable task per issue</text>

  <rect x="324" y="252" width="228" height="104" rx="12" class="box"/>
  <text x="342" y="282" class="h">Criteria gate</text>
  <text x="342" y="304" class="s">acceptance criteria,</text>
  <text x="342" y="322" class="s">verification commands,</text>
  <text x="342" y="340" class="s">files in scope, test plan</text>

  <rect x="324" y="388" width="228" height="96" rx="12" class="box"/>
  <text x="342" y="418" class="h">Supervisor</text>
  <text x="342" y="440" class="s">lease + ETA, heartbeat,</text>
  <text x="342" y="458" class="s">nudge, retry, escalate</text>
  <text x="342" y="476" class="s">reclaim on worker death</text>

  <rect x="324" y="516" width="228" height="104" rx="12" class="box"/>
  <text x="342" y="546" class="h">Verifier</text>
  <text x="342" y="568" class="s">1 repo CI · 2 contract run</text>
  <text x="342" y="586" class="s">3 verifier session</text>
  <text x="342" y="604" class="s">else UNVERIFIED, never green</text>

  <rect x="596" y="140" width="278" height="128" rx="12" class="box store"/>
  <text x="614" y="170" class="h">State of record</text>
  <text x="614" y="194" class="s">remediation_task: state, contract</text>
  <text x="614" y="212" class="s">hash, sessions, PR, attempts, ACU</text>
  <text x="614" y="230" class="s">owner_id, lease_expires_at, eta_at</text>
  <text x="614" y="252" class="s">task_event: append-only audit</text>

  <rect x="596" y="292" width="278" height="118" rx="12" class="box store"/>
  <text x="614" y="322" class="h">Repository registry</text>
  <text x="614" y="346" class="s">access validated at connect time</text>
  <text x="614" y="364" class="s">profile per repo: build, test, CI,</text>
  <text x="614" y="382" class="s">layout, risk, AGENTS/CLAUDE rules</text>
  <text x="614" y="400" class="s">refreshed per slice on push</text>

  <rect x="596" y="434" width="278" height="106" rx="12" class="box store"/>
  <text x="614" y="464" class="h">Learning store</text>
  <text x="614" y="488" class="s">repo-specific → that repo's prompts</text>
  <text x="614" y="506" class="s">general → Devin knowledge / playbook</text>
  <text x="614" y="524" class="s">retired when it stops paying off</text>

  <rect x="596" y="564" width="278" height="56" rx="12" class="box"/>
  <text x="614" y="594" class="h">Dashboard + report</text>
  <text x="614" y="612" class="s">board, KPIs, per-issue audit trail</text>

  <!-- devin column -->
  <rect x="948" y="150" width="242" height="120" rx="12" class="box devin"/>
  <text x="966" y="180" class="h">Scoping session</text>
  <text x="966" y="204" class="s">reads the issue and the repo</text>
  <text x="966" y="222" class="s">profile, returns a structured</text>
  <text x="966" y="240" class="s">contract or refuses the issue</text>
  <text x="966" y="260" class="s">bounded: ~3 ACU</text>

  <rect x="948" y="300" width="242" height="140" rx="12" class="box devin"/>
  <text x="966" y="330" class="h">Remediation session</text>
  <text x="966" y="354" class="s">implements inside the agreed</text>
  <text x="966" y="372" class="s">scope, adds or updates the tests</text>
  <text x="966" y="390" class="s">named in the plan, runs the</text>
  <text x="966" y="408" class="s">verification commands, opens</text>
  <text x="966" y="426" class="s">the PR — bounded: ~10 ACU</text>

  <rect x="948" y="470" width="242" height="98" rx="12" class="box devin"/>
  <text x="966" y="500" class="h">Follow-up session</text>
  <text x="966" y="524" class="s">same session, resumed with</text>
  <text x="966" y="542" class="s">red CI or reviewer comments</text>
  <text x="966" y="560" class="s">until the attempt budget runs out</text>

  <!-- outcomes -->
  <rect x="324" y="644" width="110" height="0" class="box"/>

  <!-- flows -->
  <path class="flow" d="M250 181 H 318"/>
  <path class="flow" d="M250 284 C 280 284, 290 320, 318 320"/>
  <path class="flow" d="M438 220 V 246"/>
  <path class="flow" d="M438 356 V 382"/>
  <path class="flow" d="M438 484 V 510"/>
  <path class="flow" d="M250 505 C 285 505, 292 545, 318 552"/>
  <path class="flow" d="M552 300 C 700 240, 830 210, 942 200"/>
  <text x="690" y="232" class="lbl">POST /v3/.../sessions</text>
  <path class="flow" d="M942 258 C 830 268, 700 282, 556 300" />
  <text x="706" y="290" class="lbl">structured contract</text>
  <path class="flow" d="M552 430 C 760 452, 860 400, 944 372"/>
  <text x="640" y="460" class="lbl">dispatch on accepted contract</text>
  <path class="flow dash" d="M944 400 C 800 420, 700 470, 556 470"/>
  <path class="flow dash" d="M948 520 C 820 540, 700 560, 556 566"/>
  <path class="flow" d="M552 200 H 590"/>
  <path class="flow" d="M552 340 H 590"/>
  <path class="flow" d="M552 470 H 590"/>
  <path class="flow" d="M552 590 H 590"/>
  <path class="flow" d="M330 596 C 300 596, 270 620, 254 614"/>
  <path class="flow dash" d="M330 560 C 290 560, 262 520, 252 500"/>
  <path class="flow" d="M948 380 C 720 700, 420 704, 254 420"/>
  <text x="584" y="706" class="lbl">Devin opens the pull request in your repository</text>

  <!-- outcome badges -->
  <rect x="286" y="228" width="26" height="26" rx="8" class="box bad"/>
  <text x="292" y="247" class="t" font-size="14">✕</text>
  <text x="150" y="672" class="lbl">✕ no checkable definition of done → menD:not-a-candidate</text>
</svg>
