<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="470" viewBox="0 0 1460 470"
     font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="rgba(25,25,25,0.56)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="rgba(25,25,25,0.32)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1460" height="470" fill="#fcfcfc"/>

  <!-- Main row: label in, verified pull request out -->
  <g>
    <rect x="20" y="56" width="200" height="120" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="120" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Issue labelled</text>
    <rect x="81" y="92" width="77" height="20" rx="10" fill="#e0ebff" stroke="rgba(49,124,255,0.35)"/>
    <text x="120" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#1c53b8">menD:fix</text>
    <text x="120" y="134" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">a webhook, or the 30s poll</text>
    <text x="120" y="150" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">one durable task per issue</text>

    <rect x="260" y="56" width="200" height="120" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Candidate gate</text>
    <text x="360" y="106" text-anchor="middle" font-size="10.5" fill="rgb(49,124,255)">Devin scoping session &#183; ~3 ACU</text>
    <text x="360" y="134" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">a free pre-filter first, then a</text>
    <text x="360" y="150" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">machine-checkable contract</text>

    <rect x="500" y="56" width="200" height="120" rx="10" fill="#ffffff" stroke="rgba(49,124,255,0.55)"/>
    <text x="600" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Devin remediation</text>
    <rect x="531" y="92" width="138" height="20" rx="10" fill="#fdeee2" stroke="rgba(245,142,58,0.4)"/>
    <text x="600" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#a65a1c">menD:in-progress</text>
    <text x="600" y="134" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">implements the scope, adds tests</text>
    <text x="600" y="150" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">~10 ACU &#183; lease PT2M, beat PT30S</text>

    <rect x="740" y="56" width="200" height="120" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="840" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Verification</text>
    <rect x="786" y="92" width="107" height="20" rx="10" fill="#e0ebff" stroke="rgba(49,124,255,0.35)"/>
    <text x="840" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#1c53b8">menD:pr-open</text>
    <text x="840" y="134" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">repo CI &#8594; contract run &#8594;</text>
    <text x="840" y="150" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">verifier session, never the author</text>

    <rect x="980" y="56" width="200" height="120" rx="10" fill="#ffffff" stroke="rgba(0,165,88,0.55)"/>
    <text x="1080" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Succeeded</text>
    <rect x="1038" y="92" width="84" height="20" rx="10" fill="#d9f1e6" stroke="rgba(0,165,88,0.4)"/>
    <text x="1080" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#00733c">menD:done</text>
    <text x="1080" y="134" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">state of record: SUCCEEDED</text>
    <text x="1080" y="150" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">evidence on the issue and the PR</text>

    <rect x="1220" y="56" width="200" height="120" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="1320" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Lesson captured</text>
    <text x="1320" y="106" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">deduped, retired when it</text>
    <text x="1320" y="122" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">stops earning its place</text>
    <text x="1320" y="146" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">repo &#8594; the next prompt</text>
    <text x="1320" y="162" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">general &#8594; Devin knowledge</text>
  </g>

  <!-- Main path -->
  <g fill="none" stroke="rgba(25,25,25,0.56)" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M 220 116 L 258 116"/>
    <path d="M 460 116 L 498 116"/>
    <path d="M 700 116 L 738 116"/>
    <path d="M 940 116 L 978 116"/>
    <path d="M 1180 116 L 1218 116"/>
  </g>
  <g font-size="10.5" fill="rgba(25,25,25,0.56)" text-anchor="middle">
    <text x="239" y="42">ingested</text>
    <text x="479" y="42">accepted</text>
    <text x="719" y="42" font-weight="600" fill="rgb(25,25,25)">opens the PR</text>
    <text x="959" y="42">proven</text>
    <text x="1199" y="42">retrospective</text>
  </g>

  <!-- Exception row: every one of these is an honest outcome -->
  <g>
    <rect x="260" y="300" width="200" height="88" rx="10" fill="#ffffff" stroke="rgba(245,59,58,0.45)"/>
    <text x="360" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Not a candidate</text>
    <rect x="276" y="336" width="168" height="20" rx="10" fill="#fde2e2" stroke="rgba(245,59,58,0.4)"/>
    <text x="360" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#b32b2a">menD:not-a-candidate</text>
    <text x="360" y="376" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">the reasons, and what to add</text>

    <rect x="500" y="300" width="200" height="88" rx="10" fill="#ffffff" stroke="rgba(245,59,58,0.45)"/>
    <text x="600" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Needs a human</text>
    <rect x="531" y="336" width="138" height="20" rx="10" fill="#fde2e2" stroke="rgba(245,59,58,0.4)"/>
    <text x="600" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#b32b2a">menD:needs-human</text>
    <text x="600" y="376" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">budget or blocker, handed over</text>

    <rect x="740" y="300" width="200" height="88" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="840" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Changes requested</text>
    <rect x="748" y="336" width="183" height="20" rx="10" fill="#fdeee2" stroke="rgba(245,142,58,0.4)"/>
    <text x="840" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#a65a1c">menD:changes-requested</text>
    <text x="840" y="376" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">the reviewer's words, verbatim</text>

    <rect x="980" y="300" width="200" height="88" rx="10" fill="#ffffff" stroke="rgba(245,142,58,0.5)"/>
    <text x="1080" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Unverified</text>
    <rect x="1015" y="336" width="130" height="20" rx="10" fill="#fdeee2" stroke="rgba(245,142,58,0.4)"/>
    <text x="1080" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#a65a1c">menD:unverified</text>
    <text x="1080" y="376" text-anchor="middle" font-size="10.5" fill="rgba(25,25,25,0.56)">a fix, never called a success</text>
  </g>

  <!-- Exits into the exception row, and the two loops back -->
  <g fill="none" stroke="rgba(25,25,25,0.32)" stroke-width="1.6" marker-end="url(#arrowlight)">
    <path d="M 360 176 L 360 298"/>
    <path d="M 560 176 L 560 298"/>
    <path d="M 840 176 L 840 298"/>
    <path d="M 940 176 L 1055 298"/>
    <path d="M 1180 315 L 1272 178"/>
  </g>
  <g fill="none" stroke="rgba(25,25,25,0.32)" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowlight)">
    <path d="M 840 388 L 840 424 L 480 424 L 480 190 L 520 190 L 520 178"/>
  </g>
  <g font-size="10.5" fill="rgba(25,25,25,0.56)">
    <text x="352" y="240" text-anchor="end">no checkable contract</text>
    <text x="568" y="240">out of budget, or blocked</text>
    <text x="847" y="240">a reviewer objects</text>
    <text x="1035" y="286" text-anchor="end">nothing independent proves it</text>
    <text x="648" y="440">back to the same session, in bounded rounds</text>
  </g>

  <text x="20" y="462" font-size="10.5" fill="rgba(25,25,25,0.56)">One menD container drives all of it: the label and the pull request live in your GitHub org, the two Devin sessions run at api.devin.ai, and every transition is written to menD&#8217;s own state of record.</text>
</svg>
