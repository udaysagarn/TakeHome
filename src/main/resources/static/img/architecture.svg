<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="920" viewBox="0 0 1780 920"
     font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img"
     aria-label="menD architecture: a GitHub issue labelled menD:fix flows left to right through menD ingest, the criteria gate, a Devin scoping session, the supervisor, a Devin remediation session, a pull request, verification, and a SUCCEEDED or UNVERIFIED verdict, with reviewer feedback and lessons feeding back">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1780" height="920" fill="#fcfcfc"/>

  <!-- Trust boundary zones -->
  <g fill="none" stroke="rgba(0,0,0,0.12)" stroke-dasharray="6 4">
    <rect x="24" y="70" width="1732" height="180" rx="16"/>
    <rect x="24" y="290" width="1732" height="300" rx="16"/>
    <rect x="24" y="630" width="1732" height="180" rx="16"/>
  </g>
  <g font-size="13" font-weight="600" fill="#6b6b6b" letter-spacing="0.4">
    <text x="44" y="60">GITHUB (YOUR ORG)</text>
    <text x="44" y="280">MEND CONTROL PLANE (ONE CONTAINER)</text>
    <text x="44" y="620">DEVIN API (API.DEVIN.AI)</text>
  </g>

  <!-- GitHub lane -->
  <g>
    <rect x="44" y="118" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="144" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">Issue labelled</text>
    <text x="144" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">menD:fix</text>
    <text x="144" y="194" text-anchor="middle" font-size="11.5" fill="#6b6b6b">webhook, or a 30s poll</text>
    <text x="144" y="210" text-anchor="middle" font-size="11.5" fill="#6b6b6b">if there is no ingress</text>

    <rect x="484" y="118" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(245,59,58,0.45)"/>
    <text x="584" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(245,59,58)">menD:not-a-candidate</text>
    <text x="584" y="176" text-anchor="middle" font-size="11.5" fill="#6b6b6b">every failed check is</text>
    <text x="584" y="192" text-anchor="middle" font-size="11.5" fill="#6b6b6b">commented on the issue</text>
    <text x="584" y="212" text-anchor="middle" font-size="11.5" fill="#6b6b6b">nothing was spent</text>

    <rect x="1044" y="118" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="1144" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">Pull request opened</text>
    <text x="1144" y="182" text-anchor="middle" font-size="11.5" fill="#6b6b6b">branch, fix and tests,</text>
    <text x="1144" y="198" text-anchor="middle" font-size="11.5" fill="#6b6b6b">attributed to the App</text>

    <rect x="1484" y="118" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="1584" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">Human review</text>
    <text x="1584" y="182" text-anchor="middle" font-size="11.5" fill="#6b6b6b">approve, or request</text>
    <text x="1584" y="198" text-anchor="middle" font-size="11.5" fill="#6b6b6b">changes</text>
  </g>

  <!-- menD lane, main row -->
  <g>
    <rect x="264" y="340" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="364" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">Ingest</text>
    <text x="364" y="404" text-anchor="middle" font-size="11.5" fill="#6b6b6b">one durable task per issue</text>
    <text x="364" y="420" text-anchor="middle" font-size="11.5" fill="#6b6b6b">deliveries are hints, the</text>
    <text x="364" y="436" text-anchor="middle" font-size="11.5" fill="#6b6b6b">poller reconciles</text>

    <rect x="484" y="340" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="584" y="374" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">Criteria gate</text>
    <text x="584" y="396" text-anchor="middle" font-size="11.5" fill="#6b6b6b">free pre-filter, then a</text>
    <text x="584" y="412" text-anchor="middle" font-size="11.5" fill="#6b6b6b">contract: criteria, commands,</text>
    <text x="584" y="428" text-anchor="middle" font-size="11.5" fill="#6b6b6b">files in scope, test plan</text>

    <rect x="704" y="340" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="804" y="374" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">Supervisor</text>
    <text x="804" y="396" text-anchor="middle" font-size="11.5" fill="#6b6b6b">lease PT2M, heartbeat PT30S</text>
    <text x="804" y="412" text-anchor="middle" font-size="11.5" fill="#6b6b6b">ETA and ACU budget per task</text>
    <text x="804" y="428" text-anchor="middle" font-size="11.5" fill="#6b6b6b">bounded retries</text>

    <rect x="1264" y="340" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="1364" y="374" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(25,25,25)">Verifier</text>
    <text x="1364" y="396" text-anchor="middle" font-size="11.5" fill="#6b6b6b">repo CI, then the contract</text>
    <text x="1364" y="412" text-anchor="middle" font-size="11.5" fill="#6b6b6b">workflow, then a verifier</text>
    <text x="1364" y="428" text-anchor="middle" font-size="11.5" fill="#6b6b6b">session &#8212; never its own word</text>

    <rect x="1484" y="340" width="200" height="110" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="1584" y="374" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(0,165,88)">SUCCEEDED</text>
    <text x="1584" y="396" text-anchor="middle" font-size="11.5" fill="#6b6b6b">with the evidence attached</text>
    <text x="1584" y="422" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(245,59,58)">UNVERIFIED</text>
    <text x="1584" y="440" text-anchor="middle" font-size="11.5" fill="#6b6b6b">if nothing could prove it</text>
  </g>

  <!-- menD lane, persistent state -->
  <text x="44" y="470" font-size="11.5" fill="#6b6b6b">Persistent state, read and written by every step above:</text>
  <g>
    <rect x="44" y="478" width="240" height="72" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="164" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Repository registry</text>
    <text x="164" y="528" text-anchor="middle" font-size="11.5" fill="#6b6b6b">access validated, profile</text>
    <text x="164" y="542" text-anchor="middle" font-size="11.5" fill="#6b6b6b">refreshed on push</text>

    <rect x="364" y="478" width="240" height="72" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="484" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">State of record</text>
    <text x="484" y="528" text-anchor="middle" font-size="11.5" fill="#6b6b6b">15 states, legal transitions</text>
    <text x="484" y="542" text-anchor="middle" font-size="11.5" fill="#6b6b6b">only; labels are a projection</text>

    <rect x="684" y="478" width="240" height="72" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="804" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Learning store</text>
    <text x="804" y="528" text-anchor="middle" font-size="11.5" fill="#6b6b6b">lessons deduped, retired</text>
    <text x="804" y="542" text-anchor="middle" font-size="11.5" fill="#6b6b6b">when they stop earning it</text>

    <rect x="1004" y="478" width="240" height="72" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="1124" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(25,25,25)">Dashboard and API</text>
    <text x="1124" y="528" text-anchor="middle" font-size="11.5" fill="#6b6b6b">the board, /api/report,</text>
    <text x="1124" y="542" text-anchor="middle" font-size="11.5" fill="#6b6b6b">declines shown as loudly</text>
  </g>

  <!-- Devin lane -->
  <g>
    <rect x="484" y="678" width="200" height="110" rx="12" fill="#ffffff" stroke="rgb(49,124,255)"/>
    <text x="584" y="712" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(49,124,255)">Scoping session</text>
    <text x="584" y="736" text-anchor="middle" font-size="11.5" fill="#6b6b6b">reads the issue against the</text>
    <text x="584" y="752" text-anchor="middle" font-size="11.5" fill="#6b6b6b">repo, writes the contract</text>
    <text x="584" y="772" text-anchor="middle" font-size="11.5" fill="#6b6b6b">~3 ACU</text>

    <rect x="784" y="678" width="240" height="110" rx="12" fill="#ffffff" stroke="rgb(49,124,255)"/>
    <text x="904" y="712" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(49,124,255)">Remediation session</text>
    <text x="904" y="736" text-anchor="middle" font-size="11.5" fill="#6b6b6b">implements the scope, adds</text>
    <text x="904" y="752" text-anchor="middle" font-size="11.5" fill="#6b6b6b">tests, opens the PR</text>
    <text x="904" y="772" text-anchor="middle" font-size="11.5" fill="#6b6b6b">~10 ACU &#183; follow-up rounds reuse it</text>

    <rect x="1264" y="678" width="200" height="110" rx="12" fill="#ffffff" stroke="rgb(49,124,255)"/>
    <text x="1364" y="712" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(49,124,255)">Verifier session</text>
    <text x="1364" y="736" text-anchor="middle" font-size="11.5" fill="#6b6b6b">commands only, never</text>
    <text x="1364" y="752" text-anchor="middle" font-size="11.5" fill="#6b6b6b">writes code &#8212; last tier,</text>
    <text x="1364" y="768" text-anchor="middle" font-size="11.5" fill="#6b6b6b">only if CI cannot answer</text>
  </g>

  <!-- Main flow arrows -->
  <g fill="none" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M 144 228 L 144 395 L 262 395"/>
    <path d="M 464 395 L 482 395"/>
    <path d="M 634 340 L 634 230"/>
    <path d="M 634 452 L 634 676"/>
    <path d="M 684 733 L 744 733 L 744 452"/>
    <path d="M 864 452 L 864 676"/>
    <path d="M 1024 700 L 1144 700 L 1144 230"/>
    <path d="M 1244 200 L 1354 200 L 1354 338"/>
    <path d="M 1464 395 L 1482 395"/>
    <path d="M 1364 452 L 1364 676"/>
  </g>
  <g font-size="11.5" fill="#6b6b6b">
    <text x="152" y="330">every labelled issue</text>
    <text x="642" y="300" fill="rgb(245,59,58)">no checkable contract</text>
    <text x="642" y="600">scope it</text>
    <text x="752" y="620">contract accepted</text>
    <text x="872" y="620">dispatch, budgeted</text>
    <text x="1032" y="690" font-weight="600" fill="rgb(25,25,25)">opens the pull request</text>
    <text x="1252" y="190">PR event, or the poller</text>
    <text x="1372" y="620">tier 3, if needed</text>
  </g>

  <!-- Review to remediation, and lessons -->
  <g fill="none" stroke="#a3a3a3" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowlight)">
    <path d="M 1244 150 L 1482 150"/>
    <path d="M 1584 228 L 1584 250 L 1730 250 L 1730 862 L 904 862 L 904 790"/>
    <path d="M 1550 452 L 1550 566 L 804 566 L 804 552"/>
    <path d="M 824 476 L 824 452"/>
  </g>
  <g font-size="11.5" fill="#6b6b6b">
    <text x="1258" y="142">humans review it</text>
    <text x="912" y="884">CHANGES_REQUESTED &#8212; the reviewer's words go back to the same session, in bounded rounds</text>
    <text x="812" y="580">retrospective becomes a lesson</text>
    <text x="832" y="470">lessons ride into the next prompt</text>
  </g>
</svg>
