spring:
  application:
    name: d1-orchestrator
  datasource:
    url: ${D1_DB_URL:jdbc:h2:file:./data/d1;AUTO_SERVER=TRUE}
    username: ${D1_DB_USER:sa}
    password: ${D1_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: d1-orchestrator

logging:
  level:
    ai.devin.d1: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%logger{20}] %msg%n"

d1:
  devin:
    base-url: ${DEVIN_API_URL:https://api.devin.ai}
    api-key: ${DEVIN_API_KEY:}
    criteria-acu-limit: ${D1_CRITERIA_ACU:3}
    remediation-acu-limit: ${D1_REMEDIATION_ACU:10}
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    repo: ${D1_REPO:udaysagarn/superset}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    polling-enabled: ${D1_POLLING_ENABLED:true}
    poll-interval: ${D1_POLL_INTERVAL:PT30S}
    trigger-label: ${D1_TRIGGER_LABEL:devin:fix}
  triage:
    min-confidence: ${D1_MIN_CONFIDENCE:0.7}
  engine:
    enabled: ${D1_ENGINE_ENABLED:true}
    reconcile-interval: ${D1_RECONCILE_INTERVAL:PT15S}
    max-concurrent-sessions: ${D1_MAX_CONCURRENT:4}
    max-attempts: ${D1_MAX_ATTEMPTS:2}
