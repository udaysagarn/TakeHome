spring:
  application:
    name: mend-orchestrator
  datasource:
    url: ${MEND_DB_URL:jdbc:h2:file:./data/mend;AUTO_SERVER=TRUE}
    username: ${MEND_DB_USER:sa}
    password: ${MEND_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: mend-orchestrator

logging:
  level:
    ai.devin.mend: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%logger{20}] %msg%n"

mend:
  devin:
    base-url: ${DEVIN_API_URL:https://api.devin.ai}
    api-key: ${DEVIN_API_KEY:}
    org-id: ${DEVIN_ORG_ID:}
    criteria-acu-limit: ${MEND_CRITERIA_ACU:3}
    remediation-acu-limit: ${MEND_REMEDIATION_ACU:10}
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    app:
      app-id: ${GITHUB_APP_ID:}
      installation-id: ${GITHUB_APP_INSTALLATION_ID:}
      private-key: ${GITHUB_APP_PRIVATE_KEY:}
    repo: ${MEND_REPO:udaysagarn/superset}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    polling-enabled: ${MEND_POLLING_ENABLED:true}
    poll-interval: ${MEND_POLL_INTERVAL:PT30S}
    trigger-label: ${MEND_TRIGGER_LABEL:menD:fix}
  triage:
    min-confidence: ${MEND_MIN_CONFIDENCE:0.7}
  engine:
    enabled: ${MEND_ENGINE_ENABLED:true}
    reconcile-interval: ${MEND_RECONCILE_INTERVAL:PT15S}
    max-concurrent-sessions: ${MEND_MAX_CONCURRENT:4}
    max-attempts: ${MEND_MAX_ATTEMPTS:2}
