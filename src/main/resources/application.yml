spring:
  application:
    name: mend-orchestrator
  datasource:
    url: ${MEND_DB_URL:jdbc:h2:file:./data/mend;AUTO_SERVER=TRUE}
    username: ${MEND_DB_USER:sa}
    password: ${MEND_DB_PASSWORD:}
  jpa:
    hibernate:
      # The schema is owned by the migrations in db/migration, never by Hibernate.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    # A database created before the migrations existed holds the same tables with no history
    # table. Adopt it at the baseline version instead of refusing to start; ddl-auto=validate
    # is the check that it really matches.
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: false
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      # One thread per @Scheduled loop and room to spare: the heartbeat has to renew a lease
      # while the reconcile loop is inside a blocking Devin or GitHub call. Read by the
      # scheduler SchedulingConfig declares, which is why that bean exists.
      pool:
        size: ${MEND_SCHEDULER_POOL_SIZE:8}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: mend-orchestrator

logging:
  level:
    ai.devin.mend: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%logger{20}] [%X{taskKey:-}] %msg%n"

mend:
  devin:
    base-url: ${DEVIN_API_URL:https://api.devin.ai}
    api-key: ${DEVIN_API_KEY:}
    org-id: ${DEVIN_ORG_ID:}
    criteria-acu-limit: ${MEND_CRITERIA_ACU:3}
    remediation-acu-limit: ${MEND_REMEDIATION_ACU:10}
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    app:
      app-id: ${GITHUB_APP_ID:}
      installation-id: ${GITHUB_APP_INSTALLATION_ID:}
      private-key: ${GITHUB_APP_PRIVATE_KEY:}
    repo: ${MEND_REPO:udaysagarn/superset}
    repos: ${MEND_REPOS:${MEND_REPO:udaysagarn/superset}}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    polling-enabled: ${MEND_POLLING_ENABLED:true}
    poll-interval: ${MEND_POLL_INTERVAL:PT30S}
    trigger-label: ${MEND_TRIGGER_LABEL:menD:fix}
  triage:
    min-confidence: ${MEND_MIN_CONFIDENCE:0.7}
  engine:
    enabled: ${MEND_ENGINE_ENABLED:true}
    reconcile-interval: ${MEND_RECONCILE_INTERVAL:PT15S}
    max-concurrent-sessions: ${MEND_MAX_CONCURRENT:4}
    max-attempts: ${MEND_MAX_ATTEMPTS:2}
    lease-duration: ${MEND_LEASE_DURATION:PT2M}
    heartbeat-interval: ${MEND_HEARTBEAT_INTERVAL:PT30S}
    criteria-eta: ${MEND_CRITERIA_ETA:PT15M}
    verify-eta: ${MEND_VERIFY_ETA:PT30M}
