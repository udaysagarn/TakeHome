<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'menD · ' + ${status}">menD</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" th:href="@{/css/devin.css}" />
    <link th:replace="~{fragments/brand :: favicon}" />
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/nav.js}" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div th:replace="~{fragments/nav :: heading(${status})}"></div>
        <span class="subtitle" th:text="${headline}">Something went wrong</span>
        <span class="spacer"></span>
        <nav th:replace="~{fragments/nav :: links('error')}"></nav>
      </header>

      <h2 class="section" th:text="${headline}">Something went wrong</h2>
      <div class="empty">
        <p th:text="${detail}">There is nothing at that address.</p>
        <p th:if="${path}" class="muted mono" th:text="${path}"></p>
      </div>
    </div>
  </body>
</html>
