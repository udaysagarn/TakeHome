<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <svg
      th:fragment="glyph"
      class="mark-glyph"
      viewBox="17 8 26 49"
      role="img"
      aria-hidden="true"
      focusable="false"
    >
      <g fill="none" stroke-width="7" stroke-linecap="round">
        <path d="M22 14 H31 a17 17 0 0 1 4 33.4" />
        <path d="M22 14 V48" />
      </g>
      <path class="mark-head" d="M36 41 L28.5 49.5 L38.5 52.5 Z" />
    </svg>

    <a th:fragment="mark" th:href="@{/}" class="mark" aria-label="menD home">
      <span class="wordmark">men</span>
      <svg th:replace="~{fragments/brand :: glyph}"></svg>
    </a>

    <span th:fragment="markStatic" class="mark">
      <span class="wordmark">men</span>
      <svg th:replace="~{fragments/brand :: glyph}"></svg>
    </span>

    <link th:fragment="favicon" rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}" />
  </body>
</html>
