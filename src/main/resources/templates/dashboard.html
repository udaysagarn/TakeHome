<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>menD · autonomous remediation</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" th:href="@{/css/devin.css}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script th:src="@{/js/theme.js}"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="mark">menD</span>
          <span>Autonomous remediation</span>
        </div>
        <span class="subtitle">
          <span class="livedot"></span>
          <span th:text="${repo}">repo</span> ·
          triggered by <code th:text="${triggerLabel}">menD:fix</code>
        </span>
        <span class="spacer"></span>
        <a class="btn" th:href="@{/api/report}">Report</a>
        <a class="btn" th:href="@{/actuator/prometheus}">Metrics</a>
        <button class="btn" onclick="cycleTheme()" title="Light → Dark → High contrast">
          Theme: <span data-theme-label>Light</span>
        </button>
      </header>

      <div hx-get="/fragments/live" hx-trigger="every 5s" hx-swap="innerHTML">
        <div th:replace="~{fragments/live :: live}"></div>
      </div>
    </div>

  </body>
</html>
