<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>menD · autonomous remediation</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" th:href="@{/css/devin.css}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link th:replace="~{fragments/brand :: favicon}" />
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/nav.js}" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div th:replace="~{fragments/nav :: heading('Flows')}"></div>
        <span class="subtitle">
          <span class="livedot"></span>
          <span th:text="${repo}">repo</span> ·
          triggered by <code th:text="${triggerLabel}">menD:fix</code>
        </span>
        <span class="spacer"></span>
        <span class="repo-switch">
          <a class="btn" th:classappend="${selectedRepo == null} ? 'primary'" th:href="@{/flows}">All</a>
          <a class="btn" th:each="r : ${view.repositories}"
             th:classappend="${r.slug == selectedRepo} ? 'primary'"
             th:href="@{/flows(repo=${r.slug})}" th:text="${r.slug}">owner/name</a>
        </span>
        <nav th:replace="~{fragments/nav :: links('flows')}"></nav>
      </header>

      <div th:hx-get="@{/fragments/live(repo=${selectedRepo})}" hx-trigger="every 5s" hx-swap="innerHTML">
        <div th:replace="~{fragments/live :: live}"></div>
      </div>
    </div>

  </body>
</html>
