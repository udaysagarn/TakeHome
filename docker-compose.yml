services:
  mend:
    build: .
    image: mend-orchestrator:local
    container_name: mend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Repositories seeded into the registry on first boot. Comma-separated.
      MEND_REPO: ${MEND_REPO:-udaysagarn/superset}
      # Devin does the engineering work. Without a key menD stays read-only.
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
      DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
      # GitHub App credentials. Without them menD cannot read issues or write labels.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # 'sandbox' replaces GitHub and Devin with in-memory simulations — see deploy/simulate.sh.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Set both to false to browse the dashboard without touching GitHub or spending ACUs.
      MEND_ENGINE_ENABLED: ${MEND_ENGINE_ENABLED:-true}
      MEND_POLLING_ENABLED: ${MEND_POLLING_ENABLED:-true}
    volumes:
      - mend-data:/app/data
    restart: unless-stopped

volumes:
  mend-data:
