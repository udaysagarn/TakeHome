services:
  mend:
    build: .
    image: mend-orchestrator:local
    container_name: mend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # The default repository, seeded into the registry on first boot.
      MEND_REPO: ${MEND_REPO:-udaysagarn/superset}
      # Additional repositories to seed, comma-separated. Optional.
      MEND_REPOS: ${MEND_REPOS:-}
      # Devin does the engineering work. Without a key menD cannot remediate anything.
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
      DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
      # GitHub App credentials. Without them menD cannot read issues or write labels.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # The reconciler and the ingestion poller. Both on is the live control plane.
      MEND_ENGINE_ENABLED: ${MEND_ENGINE_ENABLED:-true}
      MEND_POLLING_ENABLED: ${MEND_POLLING_ENABLED:-true}
    volumes:
      - mend-data:/app/data
    restart: unless-stopped

volumes:
  mend-data:
